[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# A saját kódunk elavult (deprecated) API-használata hibát okozzon, hogy 3.12-n és újabbakon is tiszta maradjon.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    error::ResourceWarning
